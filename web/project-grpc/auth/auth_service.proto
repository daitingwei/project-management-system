syntax = "proto3";
package auth.service.v1;
option go_package = "test.com/project-grpc/auth";

message AuthReqMessage {
  int64 memberId = 1;
  string organizationCode = 2;
  int64 page = 3;
  int64 pageSize = 4;
  string action = 5;
  int64 authId = 6;
  repeated string nodes = 7;
  string title = 8;
  string desc = 9;
  int32 status = 10;
  int32 sort = 11;
  string type = 12;
}

message ProjectAuth{
  int64 id = 1;
  string OrganizationCode = 2;
  string Title = 3;
  string CreateAt = 4;
  int32 Sort = 5;
  int32 status = 6;
  string desc = 7;
  int64 CreateBy = 8;
  int32 IsDefault = 9;
  string Type = 10;
  int32 CanDelete = 11;
}

message ListAuthMessage{
  repeated ProjectAuth list = 1;
  int64 total = 2;
}

message ProjectNodeMessage{
  int64 id = 1;
  string node = 2;
  string title = 3;
  string pnode = 4;
  int32 isLogin = 5;
  int32 isMenu = 6;
  int32 isAuth = 7;
  bool checked = 8;
  string key = 9;
  repeated ProjectNodeMessage children = 10;
}

message ApplyResponse {
  repeated ProjectNodeMessage list = 1;
  repeated string checkedList = 2;
}

message AuthNodesResponse {
  repeated string list = 1;
}

message DeleteAuthResponse {}

service AuthService {
  rpc AuthList(AuthReqMessage) returns(ListAuthMessage){}
  rpc Apply(AuthReqMessage) returns(ApplyResponse){}
  rpc AuthNodesByMemberId(AuthReqMessage) returns(AuthNodesResponse){}
  rpc SaveAuth(AuthReqMessage) returns(ApplyResponse){}
  rpc UpdateAuth(AuthReqMessage) returns(ApplyResponse){}
  rpc SetDefaultAuth(AuthReqMessage) returns(ApplyResponse){}
  rpc DeleteAuth(AuthReqMessage) returns(DeleteAuthResponse){}
}
