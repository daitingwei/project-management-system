name: msproject
services:
  mysql:
    container_name: mysql8
    image: mysql:8.0.35
    restart: always
    ports:
      - 3309:3306
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: dtw258989971
      MYSQL_DATABASE: msproject
    volumes:
      - ./data/mysql/data:/var/lib/mysql
      - ./data/mysql/conf:/etc/mysql/conf.d/
      - ./data/mysql/logs:/logs
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    networks:
      - default

  mysql-slave1:
    container_name: mysql8-slave1
    image: mysql:8.0.35
    restart: always
    ports:
      - 3310:3306
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: dtw258989971
      MYSQL_DATABASE: msproject
    volumes:
      - ./data/mysql/data-slave1:/var/lib/mysql
      - ./data/mysql/conf-slave1:/etc/mysql/conf.d/
      - ./data/mysql/logs-slave1:/logs
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=ON
    networks:
      - default

  mysql-slave2:
    container_name: mysql8-slave2
    image: mysql:8.0.35
    restart: always
    ports:
      - 3311:3306
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: dtw258989971
      MYSQL_DATABASE: msproject
    volumes:
      - ./data/mysql/data-slave2:/var/lib/mysql
      - ./data/mysql/conf-slave2:/etc/mysql/conf.d/
      - ./data/mysql/logs-slave2:/logs
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --server-id=3
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=ON
    networks:
      - default

  mysql-replication-init:
    image: mysql:8.0.35
    container_name: mysql-replication-init
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: dtw258989971
    volumes:
      - ./data/mysql/init/setup-replication.sh:/setup.sh:ro
    entrypoint: ["/bin/bash", "/setup.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      mysql-slave1:
        condition: service_healthy
      mysql-slave2:
        condition: service_healthy
    networks:
      - default

  redis:
    container_name: redis7
    image: redis:7.2
    restart: always
    volumes:
      - ./data/redis:/data
      - ./data/redis/conf/redis.conf:/etc/redis/redis.conf
    ports:
      - 6379:6379
    command: redis-server /etc/redis/redis.conf
    networks:
      - default

  etcd:
    container_name: etcd3
    image: quay.io/coreos/etcd:v3.5.9
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    privileged: true
    volumes:
      - ./data/etcd/data:/bitnami/etcd/data
    ports:
      - 2379:2379
      - 2380:2380
    networks:
      - default

  nacos:
    container_name: nacos-standalone
    image: nacos/nacos-server:v2.2.0
    restart: always
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=1g
      - JVM_XMN=256m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql8
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=dtw258989971
    privileged: true
    volumes:
      - ./data/nacos/data:/home/nacos/data
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/conf:/home/nacos/conf
    ports:
      - 8848:8848
      - 9848:9848
      - 9849:9849
    depends_on:
      - mysql
    networks:
      - default

  kafka:
    container_name: kafka
    image: obsidiandynamics/kafka:latest
    restart: always
    ports:
      - 2181:2181
      - 9092:9092
    environment:
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT: 6000
      KAFKA_RESTART_ATTEMPTS: 10
      KAFKA_RESTART_DELAY: 5
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 0
    volumes:
      - ./data/kafka/data:/var/lib/kafka/data
    networks:
      - default

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.41
    restart: always
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    privileged: true
    volumes:
      - ./data/jaeger:/badger
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686
      - 14268:14268
      - 14269:14269
      - 9411:9411
    networks:
      - default

  es:
    container_name: es
    image: elasticsearch:8.6.0
    restart: always
    volumes:
      - ./data/es/data:/usr/share/elasticsearch/data
      - ./data/es/plugins:/usr/share/elasticsearch/plugins
    ports:
      - 9200:9200
      - 9300:9300
    environment:
      - node.name=es
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    privileged: true
    networks:
      - default

  kibana:
    image: kibana:8.6.0
    container_name: kibana
    restart: always
    depends_on:
      - es
    environment:
      SERVER_NAME: kibana
      SERVER_HOST: "0.0.0.0"
      ELASTICSEARCH_HOSTS: http://es:9200
    ports:
      - 5601:5601
    networks:
      - default

  logstash:
    image: logstash:8.6.0
    container_name: logstash
    restart: always
    volumes:
      - ./data/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./data/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./data/logstash/log/:/home/public/
    ports:
      - '5044:5044'
      - '50000:50000/tcp'
      - '50000:50000/udp'
      - '9600:9600'
    environment:
      LS_JAVA_OPTS: -Xms1024m -Xmx1024m
      TZ: Asia/Shanghai
      MONITORING_ENABLED: false
    depends_on:
      - es
      - kafka
    networks:
      - default

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    restart: always
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      JVM_OPTS: "-Xms16M -Xmx48M -Xss180K -XX:-TieredCompilation -XX:+UseStringDeduplication -noverify"
    depends_on:
      - kafka
    networks:
      - default

  minio:
    container_name: minio
    image: minio/minio:latest
    restart: always
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123456
    volumes:
      - ./data/minio/data:/data
    ports:
      - '9009:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    networks:
      - default

networks:
  default:
    driver: bridge
