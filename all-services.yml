name: msproject
services:
  # ==================== MySQL 主从复制 ====================
  mysql-master:
    image: mysql:8.0.35
    container_name: mysql8
    restart: always
    ports:
      - "3309:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: dtw258989971
      MYSQL_DATABASE: msproject
    volumes:
      - ./data/mysql/data:/var/lib/mysql
      - ./data/mysql/conf:/etc/mysql/conf.d/
      - ./data/mysql/logs:/logs
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    networks:
      - default

  mysql-slave1:
    image: mysql:8.0.35
    container_name: mysql8-slave1
    restart: always
    ports:
      - "3310:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: dtw258989971
      MYSQL_DATABASE: msproject
    volumes:
      - ./data/mysql/data-slave1:/var/lib/mysql
      - ./data/mysql/conf-slave1:/etc/mysql/conf.d/
      - ./data/mysql/logs-slave1:/logs
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
      - --server-id=2
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=ON
    networks:
      - default

  mysql-slave2:
    image: mysql:8.0.35
    container_name: mysql8-slave2
    restart: always
    ports:
      - "3311:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: dtw258989971
      MYSQL_DATABASE: msproject
    volumes:
      - ./data/mysql/data-slave2:/var/lib/mysql
      - ./data/mysql/conf-slave2:/etc/mysql/conf.d/
      - ./data/mysql/logs-slave2:/logs
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
      - --server-id=3
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=ON
    networks:
      - default

  # ==================== Redis ====================
  redis:
    image: redis:7.2
    container_name: redis7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    networks:
      - default

  # ==================== Etcd ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd3
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    privileged: true
    volumes:
      - ./data/etcd/data:/bitnami/etcd/data
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - default

  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.1.2-slim
    container_name: nacos-standalone
    restart: always
    platform: linux/arm64
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      # 使用 Derby 内嵌数据库（开发测试用）
      # - SPRING_DATASOURCE_PLATFORM=mysql
      # - MYSQL_SERVICE_HOST=mysql8
      # - MYSQL_SERVICE_DB_NAME=nacos
      # - MYSQL_SERVICE_PORT=3306
      # - MYSQL_SERVICE_USER=root
      # - MYSQL_SERVICE_PASSWORD=dtw258989971
    privileged: true
    volumes:
      - ./data/nacos/data:/home/nacos/data
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/conf:/home/nacos/conf
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - mysql-master
    networks:
      - default

  # ==================== Kafka ====================
  kafka:
    image: obsidiandynamics/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "2181:2181"
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT: 6000
      KAFKA_RESTART_ATTEMPTS: 10
      KAFKA_RESTART_DELAY: 5
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 0
    volumes:
      - ./data/kafka/data:/var/lib/kafka/data
    networks:
      - default

  # ==================== Jaeger (链路追踪) ====================
  jaeger:
    image: jaegertracing/all-in-one:1.41
    container_name: jaeger
    restart: always
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    privileged: true
    volumes:
      - ./data/jaeger:/badger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    networks:
      - default

  # ==================== MinIO (对象存储 - 代码中使用) ====================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123456
    ports:
      - "9009:9000"
      - "9001:9001"
    volumes:
      - ./data/minio/data:/data
    command: server /data --console-address ":9001"
    networks:
      - default

  # ==================== 可选服务（未在代码中直接使用） ====================
